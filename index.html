<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>반포 아이작&이인이공 수업 입력 by RoutineLab </title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="app">

    <section class="card">

      <div class="logo">📚</div>

      <h1>RoutineLab</h1>

      <p class="subtitle">
        수업기록 입력
      </p>


      <div class="telegram-box">

        <div class="label">
          Telegram 계정
        </div>

        <div id="telegramUser">
          확인 중...
        </div>

      </div>


      <div class="notice">

        <strong>
          📝 수업 입력 안내
        </strong>

        <p>
          수업기록 입력은 등록된 강사 계정으로
          Google Form에 로그인한 후 작성해주세요.
        </p>

        <p class="small">
          등록되지 않은 Google 계정으로는
          문자 작성 알림을 받을 수 없습니다.
        </p>

      </div>


      <button
        id="lessonButton"
        class="primary-button"
      >
        📝 수업 입력하기
      </button>

    </section>

  </main>


  <script src="app.js"></script>

</body>
</html>
